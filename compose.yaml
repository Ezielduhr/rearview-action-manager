services:
  mirror:
    image: rearview-action-manager/rearview-mirror:latest
    ports:
      - "3000:3000"
#    networks:
#      - front-tier
#      - back-tier
#    configs:
#      - httpd-config
#    secrets:
#      - server-certificate

  cam:
    image: rearview-action-manager/rearview-cam:latest
    ports:
      - "8080:8080"
    depends_on:
      storage:
        condition: service_healthy
#    volumes:
#      - db-data:/etc/data
#    networks:
#      - back-tier

  storage:
    image: postgres:17-alpine
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: publicPass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

#    networks:
#      - back-tier

volumes:
  pgdata:
    driver: local

